<!DOCTYPE html>
<html>
<head>
  <title>Task Manager</title>
  <style>
    body {
      font-family: Arial;
      background: #e5f3f3;
      padding: 20px;
    }
    .card {
      background: rgb(51, 250, 247);
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input {
      padding: 8px;
      margin: 5px;
    }
    button {
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  

<div class="card">
  <h2>Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  
</div>

  

<div id="dashboard" style="display:none;">

  <div class="card">
    <h2>Create Project (Admin)</h2>
    <input id="projectTitle" placeholder="Project Title">
    <input id="projectDesc" placeholder="Description">
    <button onclick="createProject()">Create Project</button>
  </div>

  <div class="card">
    <h2>Create Task</h2>
    <input id="taskTitle" placeholder="Task title">
    <select id="projectSelect"></select>
    <button onclick="createTask()">Create Task</button>
  </div>

  <div class="card">
    <h2>Tasks</h2>
    <ul id="taskList"></ul>
  </div>
<button onclick="logout()">Logout</button>
</div>

<script>
    

let token = "";
let role = "";

async function login() {
  const emailValue = document.getElementById("email").value;
  const passwordValue = document.getElementById("password").value;

  try {
    const res = await fetch("http://localhost:5000/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: emailValue,
        password: passwordValue
      })
    });

    const data = await res.json();
    console.log("LOGIN RESPONSE:", data);

    if (!data.token) {
      alert(data.message || "Login failed");
      return;
    }

    token = data.token;

    const payload = JSON.parse(atob(token.split('.')[1]));
    role = payload.role;

    document.getElementById("dashboard").style.display = "block";

    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) logoutBtn.style.display = "block";

    alert("Logged in successfully!");

    getProjects();
    getTasks();

  } catch (error) {
    console.log(error);
    alert("Error connecting to server");
  }
}

function logout() {
  token = "";
  role = "";
  document.getElementById("dashboard").style.display = "none";

  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) logoutBtn.style.display = "none";

  alert("Logged out");
}

async function createProject() {
  await fetch("http://localhost:5000/api/projects", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({
      title: document.getElementById("projectTitle").value,
      description: document.getElementById("projectDesc").value
    })
  });

  getProjects();
}

async function getProjects() {
  const res = await fetch("http://localhost:5000/api/projects", {
    headers: { "Authorization": token }
  });

  const projects = await res.json();

  const select = document.getElementById("projectSelect");
  if (!select) return;

  select.innerHTML = "";

  projects.forEach(p => {
    const option = document.createElement("option");
    option.value = p._id;
    option.text = p.title;
    select.appendChild(option);
  });
}

async function createTask() {
  await fetch("http://localhost:5000/api/tasks", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({
      title: document.getElementById("taskTitle").value,
      projectId: document.getElementById("projectSelect").value
    })
  });

  getTasks();
}

async function getTasks() {
  const res = await fetch("http://task-management-production-411b.up.railway.app/", {
    headers: { "Authorization": token }
  });

  const tasks = await res.json();

  const list = document.getElementById("taskList");
  if (!list) return;

  list.innerHTML = "";

  tasks.forEach(task => {
    const li = document.createElement("li");
    li.innerText = task.title + " - " + task.status;

    li.onclick = async () => {
      await fetch(`http://localhost:5000/api/tasks/${task._id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": token
        },
        body: JSON.stringify({ status: "completed" })
      });

      getTasks();
    };

    list.appendChild(li);
  });
}
</script>

</script>

</body>
</html>
